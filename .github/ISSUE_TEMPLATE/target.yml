name: Nominate a tool
description: Something the agent era is missing, or something that exists but should run on your machine instead of someone else's.
title: "[target] "
labels: ["target"]
body:
  - type: markdown
    attributes:
      value: |
        Nominations are ranked by 👍 reactions. The one at the top gets built.
  - type: input
    id: tool
    attributes:
      label: The tool
      placeholder: A local replay of every tool call my agent made yesterday
    validations:
      required: true
  - type: input
    id: today
    attributes:
      label: What people use today
      placeholder: Nothing / a SaaS at $30 per seat / a script everyone rewrites
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it actually solve?
      description: The underlying problem, in plain language. Not a feature list.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why should this run on the user's machine?
      description: What leaves the laptop today that has no business leaving? What breaks when the vendor's server is down?
    validations:
      required: true
  - type: textarea
    id: core
    attributes:
      label: What would it need to do for you to actually use it?
      description: The minimum that makes it a daily driver. Be honest.
    validations:
      required: true
