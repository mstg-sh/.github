name: Nominate the next drop
description: A tool that should exist, or one that exists and should run on your machine instead of theirs.
title: "[drop] "
labels: ["target"]
body:
  - type: markdown
    attributes:
      value: |
        Nominations are ranked by 👍 reactions. The one at the top gets built.
  - type: input
    id: tool
    attributes:
      label: The tool
      placeholder: One sentence. What it does.
    validations:
      required: true
  - type: input
    id: today
    attributes:
      label: What you use today
      placeholder: Nothing / a SaaS at $30 per seat / a script everyone rewrites
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The actual problem
      description: In plain language. Not a feature list.
    validations:
      required: true
  - type: textarea
    id: local
    attributes:
      label: Why it should be a drop
      description: What leaves your machine today that has no business leaving? What breaks when the vendor is down? What is finished about it that they keep charging for?
    validations:
      required: true
  - type: textarea
    id: core
    attributes:
      label: The minimum that makes it a daily driver
      description: Be honest. The version you would actually switch to.
    validations:
      required: true
